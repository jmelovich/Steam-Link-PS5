name: build

# Steam-Link-PS5 - Build and release automation.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the app folder and its ZIP on every push and pull request, and - when a
# v* tag is pushed - publishes that same ZIP as a GitHub release so nobody has to
# build and upload one by hand.
#
#   git tag -a v0.1.0 -m "First public build" && git push origin v0.1.0
#
# The release is created as a draft: check the notes, then press Publish.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, NOT ubuntu-latest. This toolchain targets Clang 18
    # (tooling/prospero-clang18; tools/doctor.sh prefers the -18 binaries), and
    # 24.04 is the newest image that ships it: 24.04 carries Clang 16/17/18,
    # while 26.04 carries only 20/21/22. The ubuntu-latest label began moving to
    # 26.04 on 2026-10-19, which would have swapped the compiler out from under
    # the build without touching this file. Bump deliberately, with a test run.
    runs-on: ubuntu-24.04
    outputs:
      title-id: ${{ steps.identity.outputs.title-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # tools/doctor.sh lists what the build needs. The 24.04 image already has
      # clang/llvm/python3/ninja; installing them anyway keeps the dependency
      # explicit and survives image changes.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-format clang-tidy llvm lld wget unzip

      # tools/setup-native-dependencies.sh downloads the public PS5 payload SDK
      # and a zlib tarball, both SHA-256 verified. Pure downloads, so caching
      # them cannot go stale: the key covers the script that pins the hashes.
      - name: Cache the payload SDK
        uses: actions/cache@v6
        with:
          path: .deps/native
          key: native-deps-${{ runner.os }}-${{ hashFiles('tools/setup-native-dependencies.sh') }}

      - name: Check the host has what the build needs
        run: make doctor

      # ps5-homebrew-catalog reads contentVersion from the committed
      # sce_sys/param.json at the release tag, and a console compares it with
      # the installed copy's. Stamping it here instead would leave the committed
      # value behind, so the listing would show a release no console offers as
      # an update. tools/release.sh bumps and commits it before tagging; this
      # only proves the two agree, and fails the release if they do not.
      - name: Verify contentVersion matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/set-content-version.sh --check "$GITHUB_REF_NAME"

      # Fetches the SDK on first run, cross-builds ihslib/protobuf-c/mbedtls/opus
      # into build/deps, then compiles, links, fake-signs and assembles the app.
      - name: Build
        run: make app

      - name: Read the title id
        id: identity
        run: |
          title_id=$(python3 -c 'import json;print(json.load(open("sce_sys/param.json"))["titleId"])')
          echo "title-id=$title_id" >> "$GITHUB_OUTPUT"
          ls -l "dist/$title_id.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.title-id }}
          path: dist/${{ steps.identity.outputs.title-id }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04 # pinned for the same reason as the build job
    permissions:
      contents: write # overrides the repo's read-only default; verified working
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tag history for the compare link

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.title-id }}
          path: dist

      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: dist/${{ needs.build.outputs.title-id }}.zip
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
              printf 'Unpack `%s` into `/data/homebrew/` on the console, then launch\n' "$(basename "$ZIP")"
              printf '**Steam Remote Play** from the home screen. Full instructions are in the\n'
              printf '[README](https://github.com/%s#install).\n\n' "$GITHUB_REPOSITORY"
              if [[ -n $previous ]]; then
                  printf '**Changes**: https://github.com/%s/compare/%s...%s\n\n' \
                      "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME"
              fi
              printf 'Unofficial. Not affiliated with Valve or Sony; contains no licensed code.\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              "$ZIP" LICENSE THIRD_PARTY_NOTICES.md
